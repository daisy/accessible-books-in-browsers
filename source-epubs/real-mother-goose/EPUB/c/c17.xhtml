<div id="h3_29"><h3 class="centeredh3">Robin and Richard</h3></div>
<p class="poemtopfull">Robin and Richard were two pretty men,</p>
<p class="poemfull">They lay in bed till the clock struck ten;</p>
<p class="poemfull">Then up starts Robin and looks at the sky,</p>
<p class="poemfull">“Oh, brother Richard, the sun’s very high!</p>
<p class="poemfull">You go before, with the bottle and bag,</p>
<p class="poemfull">And I will come after on little Jack Nag.”</p>
