<div id="h3_80"><h3>Humpty Dumpty</h3></div>
<p class="poemtop">Humpty Dumpty sat on a wall,</p>
<p class="poem">Humpty Dumpty had a great fall;</p>
<p class="poem">All the King’s horses, and all the King’s men</p>
<p class="poem">Cannot put Humpty Dumpty together again.</p>
